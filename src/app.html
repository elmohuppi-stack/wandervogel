<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<!-- Die Feldansicht wird am Lenker und im Gehen bedient: kein
		     versehentliches Zoomen durch Doppeltipp. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#e9ece6" />
		<script>
			// Läuft vor dem ersten Anstrich, damit die App nicht hell aufblitzt,
			// bevor der Dunkelmodus greift. Standard ist hell — die warme
			// Kartenwelt ist der Normalfall, nicht die Systemeinstellung.
			try {
				var t = localStorage.getItem('wv.theme');
				document.documentElement.dataset.theme =
					t === 'dark' || t === 'system' ? t : 'light';
				// Aus demselben Grund wie das Thema: die Schiene darf beim Laden
				// nicht erst breit stehen und dann zusammenschnappen.
				document.documentElement.dataset.nav =
					localStorage.getItem('wv.nav') === 'schmal' ? 'schmal' : 'weit';
			} catch (e) {
				// Privater Modus oder gesperrter Speicher: die Vorgaben.
				document.documentElement.dataset.theme = 'light';
				document.documentElement.dataset.nav = 'weit';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
