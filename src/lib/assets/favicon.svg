<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Wandervogel</title>
  <!--
    Ein gezeichnetes W, kein <text>.

    Schrift im Favicon hängt an der Schriftauswahl des Betriebssystems und
    fällt auf jedem Gerät anders aus — bei 16 Pixeln entscheidet das über
    lesbar oder Matsch. Als Pfad ist es überall dieselbe Form, und es folgt
    derselben Regel wie der Iconsatz: eine Strichstärke, runde Enden.

    Vorher lag hier das Svelte-Logo aus der Projektvorlage.
  -->
  <rect width="32" height="32" rx="7" fill="#a3392b" />
  <path
    d="M7 10 L11.6 22 L16 14 L20.4 22 L25 10"
    fill="none"
    stroke="#fdfcf9"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
